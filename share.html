<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ede8db" />
    <meta name="description" content="随舟 · 网址分享驿站 - 提交与好友分享的有趣网址" />
    <title>随舟 · 网址分享</title>
    <link rel="icon" href="/assets/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="/src/styles/fonts.css" />
    <link rel="stylesheet" href="/src/styles/site.css" />
    <link rel="stylesheet" href="/src/styles/share.css" />
  </head>
  <body class="share-page">
    <div class="water-canvas-bg"></div>

    <header class="header">
      <div class="header-left">
        <a href="/" class="back-link" title="返回随舟">
          <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
          </svg>
          <span>随舟</span>
        </a>
      </div>
      <div class="header-center">
        <h1 class="page-title">分享驿站</h1>
      </div>
      <div class="header-right">
        <button type="button" id="copy-page-link" class="btn-text" title="复制本站分享地址给好友">
          <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
          </svg>
          <span class="btn-label">分享本页</span>
        </button>
      </div>
    </header>

    <main class="container">
      <!-- 提交卡片 -->
      <section class="card form-card">
        <div class="card-header">
          <div class="seal-badge">驿</div>
          <div class="card-titles">
            <h2 class="card-title">提交新网址</h2>
            <p class="card-subtitle">粘贴链接，随时随地与我分享精彩见闻</p>
          </div>
        </div>

        <form id="share-form" class="share-form" autocomplete="off">
          <div class="field-group">
            <label for="url-input" class="field-label">网址链接 <span class="required">*</span></label>
            <div class="input-with-action">
              <input
                type="url"
                id="url-input"
                name="url"
                required
                placeholder="例如 https://example.com 或直接粘贴"
                class="input-control"
              />
              <button type="button" id="paste-btn" class="btn-action" title="粘贴剪贴板内容">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                </svg>
                <span>粘贴</span>
              </button>
            </div>
          </div>

          <div class="fields-row">
            <div class="field-group flex-1">
              <label for="note-input" class="field-label">备注 / 推荐语 <span class="optional">(可选)</span></label>
              <input
                type="text"
                id="note-input"
                name="note"
                maxlength="200"
                placeholder="简述推荐理由、文章内容..."
                class="input-control"
              />
            </div>
            <div class="field-group sender-group">
              <label for="sender-input" class="field-label">您的名字 <span class="optional">(可选)</span></label>
              <input
                type="text"
                id="sender-input"
                name="sender"
                maxlength="30"
                placeholder="如: 老张"
                class="input-control"
              />
            </div>
          </div>

          <button type="submit" id="submit-btn" class="btn-submit">
            <span class="btn-text-content">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" class="submit-icon" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
              </svg>
              <span>立即提交分享</span>
            </span>
            <span class="btn-spinner" aria-hidden="true"></span>
          </button>
        </form>
      </section>

      <!-- 分享列表 -->
      <section class="card list-card">
        <div class="list-header">
          <div class="list-title-wrap">
            <h2 class="card-title">最近分享</h2>
            <span id="links-count" class="badge">0 条</span>
          </div>
          <button type="button" id="refresh-btn" class="btn-icon" title="刷新列表">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
          </button>
        </div>

        <div id="links-container" class="links-list">
          <!-- 动态渲染内容 -->
          <div class="loading-state">
            <div class="spinner"></div>
            <span>正在载入分享记录...</span>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>随舟 · 行舟载墨 溯流而上</p>
    </footer>

    <!-- 弹窗通知 -->
    <div id="toast" class="toast" role="alert" aria-live="assertive"></div>

    <script type="module" src="/src/share/main.ts"></script>
  </body>
</html>
