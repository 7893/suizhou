# 随舟 visitor script and trail sink. Included only by the 3.0.1.4 TLS server.

location = /sz/visit.js {
    alias /var/www/suizhou/track/visit.js;
    default_type application/javascript;
    include /usr/local/etc/nginx/suizhou_headers.inc;
    add_header Cache-Control "no-cache" always;
    limit_req zone=general burst=10 nodelay;
}

location = /sz/track {
    if ($request_method != "POST") { return 444; }
    if ($is_sz_bot) { return 444; }
    limit_req zone=sz_track burst=40 nodelay;
    client_max_body_size 16k;
    client_body_buffer_size 16k;
    access_log /var/www/suizhou/logs/visitors.jsonl sz_visitor if=$loggable;
    add_header Cache-Control "no-store" always;
    proxy_pass http://127.0.0.1:19205;
}
