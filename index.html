<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, nosnippet, noimageindex" />
    <meta name="theme-color" content="#ede8db" />
    <meta name="description" content="{{ site.description }}" />
    <title>{{ site.title }}</title>
    <link rel="stylesheet" href="./src/styles/site.css" />
    <link rel="stylesheet" href="./src/styles/layout.css" />
    <link rel="stylesheet" href="./src/styles/fonts.css" />
    <link rel="stylesheet" href="./src/styles/room.css" />
  </head>
  <body>
    <main aria-label="{{ site.label }}">
      <canvas
        id="landscape"
        aria-label="{{ scenes.ink.description }}"
        role="img"
      ></canvas>
      <button id="sun-entry" class="sun-entry" type="button" aria-label="{{ hidden.enter }}" hidden></button>
      <button id="room-return" class="room-return" type="button" hidden>{{ hidden.back }}</button>
      <div class="inscription">
        <h1>{{ scenes.ink.title }}</h1>
        <p>{{ scenes.ink.poem }}</p>
        <span class="signature">{{ site.signature }}</span>
        <span class="seal" aria-hidden="true">{{ scenes.ink.seal }}</span>
      </div>
      <div class="colophon">
        <span class="work-mark" aria-hidden="true">{{ scenes.ink.mark }}</span>
        <nav class="scene-nav" aria-label="{{ site.navigation }}">
          <button type="button" data-scene="ink" aria-pressed="true">
            {{ scenes.ink.label }}
          </button>
          <span aria-hidden="true">·</span>
          <button type="button" data-scene="city" aria-pressed="false">
            {{ scenes.city.label }}
          </button>
          <span aria-hidden="true">·</span>
          <button type="button" data-scene="coast" aria-pressed="false">
            {{ scenes.coast.label }}
          </button>
          <span aria-hidden="true" hidden>·</span>
          <button type="button" data-scene="garden" aria-pressed="false" hidden>
            {{ scenes.garden.label }}
          </button>
        </nav>
      </div>
      <p class="sr-only" id="status" aria-live="polite"></p>
      <noscript><p class="notice">{{ site.noScript }}</p></noscript>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
