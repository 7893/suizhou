name: Deploy
on:
  workflow_run:
    workflows: ["Check"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          ASSET_BASE_URL: ${{ secrets.ASSET_BASE_URL }}
      - name: Pre-compress static assets
        run: |
          find dist -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.txt' \) -exec gzip -9 -k -f {} +
      - name: Deploy to SGA Server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          rsync -avzO -e "ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15" --delete --exclude='pyq*.jpg' dist/ $SSH_USER@$SSH_HOST:/var/www/suizhou/releases/live/
          rsync -avzO -e "ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15" dist/assets/ $SSH_USER@$SSH_HOST:/var/www/suizhou/assets/
          ssh -o StrictHostKeyChecking=accept-new $SSH_USER@$SSH_HOST "sudo ln -sfn /var/www/suizhou/releases/live /var/www/suizhou/current"
